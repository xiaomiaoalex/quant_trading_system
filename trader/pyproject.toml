[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --timeout=120"
testpaths = ["tests"]
timeout = 120
timeout_method = "thread"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# Assigned from ci/test_manifest.json by trader/tests/conftest.py.
markers = [
 "p0: trading-safety regression subset that must stay green on every PR",
 "offline: remaining offline test files; no public network",
 "loopback: integration tests that drive a real loopback listener; no public network",
 "postgres: tests that require a real PostgreSQL DSN",
 "ops: host/Docker/evidence drills; explicit optional workflow only",
 "external: optional research dependencies (e.g. vectorbt); explicit optional workflow only",
 "integration: legacy marker retained for compatibility",
]
# NOTE: For running tests, use:
#   .venv\Scripts\python.exe -m pytest trader/tests/ -v
# The .venv path contains spaces, so always quote paths when running manually.

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
