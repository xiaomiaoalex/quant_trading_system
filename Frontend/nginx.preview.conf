# Branch preview gateway: static single-page application plus same-origin API
# proxy to the Control service.
#
# The gateway is the only published port of the branch preview.  It serves the
# built console and forwards the API paths to the Control service inside the
# Compose network, so the browser only ever talks to one origin and no CORS or
# cross-origin credential configuration is needed.
#
# Two rules matter for the acceptance of the preview:
#
# * an API path is never rewritten to index.html.  A missing or failing Control
#   service must surface as an HTTP error, never as a page that silently looks
#   like a working console;
# * a deep link such as /research/data is served by the SPA fallback, so the
#   browser router can resolve it.
#
# The container runs as an unprivileged user, so every writable path is under
# /tmp and the pid file is not written to /var/run.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # The console uses a server-sent-event stream; keep the upgrade headers.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream qts_control {
        server control:8090;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # --- API: same-origin proxy to the Control service ------------------
        location /api/ {
            proxy_pass http://qts_control;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 60s;
        }

        location /v1/ {
            proxy_pass http://qts_control;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 60s;
        }

        location /health {
            proxy_pass http://qts_control;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # --- static console -------------------------------------------------
        # Hashed build assets may be cached; the entry document must not be,
        # otherwise a rebuilt console keeps serving the previous bundle.
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-store";
        }

        # SPA fallback: deep links are resolved by the browser router.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
