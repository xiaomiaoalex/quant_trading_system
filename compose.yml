name: ${QTS_COMPOSE_PROJECT:-qts}

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: ${QTS_IMAGE:-qts-runtime:local}
  restart: unless-stopped

x-postgres-env: &postgres-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-trading}
  POSTGRES_USER: ${POSTGRES_USER:-trader}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader_pwd}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading}
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader_pwd}
    ports:
      # Host publication is for local operations only; the value is
      # parameterised so drills never collide with an existing PostgreSQL.
      - "${QTS_PG_BIND:-127.0.0.1}:${QTS_PG_PORT:-55432}:5432"
    volumes:
      - qts_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trader} -d ${POSTGRES_DB:-trading}"]
      interval: 5s
      timeout: 3s
      retries: 20

  control:
    <<: *app
    command: ["python", "-m", "trader.runtime.control_main"]
    environment:
      <<: *postgres-env
      QTS_ACCOUNT_ID: ${QTS_ACCOUNT_ID:-binance_spot}
      # Bind inside the container; the host publication stays 127.0.0.1.
      QTS_API_HOST: "0.0.0.0"
      QTS_TRADING_API_PORT: "8090"
      QTS_AUTH_REQUIRED: ${QTS_AUTH_REQUIRED:-1}
      QTS_USERNAME: ${QTS_USERNAME:-owner}
      QTS_PASSWORD_HASH: ${QTS_PASSWORD_HASH:-}
      QTS_ORIGIN: ${QTS_ORIGIN:-http://127.0.0.1:5173}
      QTS_DR_REQUIRED: "1"
      QTS_DR_EVIDENCE_PATH: /var/lib/qts/dr/dr-evidence.json
      QTS_BACKUP_RPO_SECONDS: ${QTS_BACKUP_RPO_SECONDS:-300}
      QTS_ALERT_WEBHOOK_URL: ${QTS_ALERT_WEBHOOK_URL:-http://alert-sink:8085/webhook}
      QTS_ALERT_HEARTBEAT_URL: ${QTS_ALERT_HEARTBEAT_URL:-http://alert-sink:8085/heartbeat}
      QTS_ALERT_INTERVAL_SECONDS: ${QTS_ALERT_INTERVAL_SECONDS:-5}
      QTS_ALERT_SIGNING_SECRET: ${QTS_ALERT_SIGNING_SECRET:-}
    ports:
      - "${QTS_CONTROL_BIND:-127.0.0.1}:${QTS_CONTROL_PORT:-8090}:8090"
    volumes:
      - qts_state:/var/lib/qts
      - ${QTS_DR_EVIDENCE_DIR:-./artifacts/foundation/phase5/evidence}:/var/lib/qts/dr:ro
    depends_on:
      postgres:
        condition: service_healthy
      alert-sink:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/health/live', timeout=2).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  execution:
    <<: *app
    command: ["python", "-m", "trader.runtime.trading_worker_main"]
    environment:
      <<: *postgres-env
      QTS_ACCOUNT_ID: ${QTS_ACCOUNT_ID:-binance_spot}
      BINANCE_ENV: ${BINANCE_ENV:-demo}
      # Secrets are mounted as files. Their values are never interpolated into
      # rendered Compose output, argv, logs or evidence.
      BINANCE_API_KEY_FILE: /run/secrets/binance_api_key
      BINANCE_SECRET_KEY_FILE: /run/secrets/binance_secret_key
      BINANCE_PROXY_URL: ${BINANCE_PROXY_URL:-}
      QTS_SYMBOLS: ${QTS_SYMBOLS:-BTCUSDT}
      QTS_INSTRUMENTS: '${QTS_INSTRUMENTS:-{"BTCUSDT":["BTC","USDT"]}}'
      QTS_STRATEGY_MODULE: ${QTS_STRATEGY_MODULE:-}
      QTS_STRATEGY_CONFIG: '${QTS_STRATEGY_CONFIG:-{}}'
      QTS_STRATEGY_WARMUP_EVENTS: ${QTS_STRATEGY_WARMUP_EVENTS:-0}
      QTS_DEPLOYMENT_ID: ${QTS_DEPLOYMENT_ID:-}
      QTS_RECONCILE_INTERVAL_SECONDS: ${QTS_RECONCILE_INTERVAL_SECONDS:-30}
      QTS_DR_REQUIRED: "1"
      QTS_DR_EVIDENCE_PATH: /var/lib/qts/dr/dr-evidence.json
      QTS_BACKUP_RPO_SECONDS: ${QTS_BACKUP_RPO_SECONDS:-300}
      QTS_ALERT_WEBHOOK_URL: ${QTS_ALERT_WEBHOOK_URL:-http://alert-sink:8085/webhook}
      QTS_ALERT_HEARTBEAT_URL: ${QTS_ALERT_HEARTBEAT_URL:-http://alert-sink:8085/heartbeat}
      QTS_ALERT_INTERVAL_SECONDS: ${QTS_ALERT_INTERVAL_SECONDS:-5}
      QTS_ALERT_SIGNING_SECRET: ${QTS_ALERT_SIGNING_SECRET:-}
      QTS_EXECUTION_HEALTH_FILE: /var/lib/qts/execution-health.json
      QTS_HEALTH_INTERVAL_SECONDS: ${QTS_HEALTH_INTERVAL_SECONDS:-5}
    secrets:
      - binance_api_key
      - binance_secret_key
    volumes:
      - qts_state:/var/lib/qts
      - ${QTS_DR_EVIDENCE_DIR:-./artifacts/foundation/phase5/evidence}:/var/lib/qts/dr:ro
    depends_on:
      postgres:
        condition: service_healthy
      alert-sink:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "trader.runtime.healthcheck",
          "execution",
          "/var/lib/qts/execution-health.json",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  research:
    <<: *app
    command: ["python", "-m", "trader.runtime.research_worker_main"]
    environment:
      <<: *postgres-env
      QTS_WORKER_POLL_SECONDS: ${QTS_WORKER_POLL_SECONDS:-2}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 15s
      timeout: 5s
      retries: 5

  history:
    <<: *app
    command: ["python", "-m", "trader.runtime.history_worker_main"]
    environment:
      <<: *postgres-env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 15s
      timeout: 5s
      retries: 5

  backup:
    <<: *app
    # The backup service holds PostgreSQL and object-store credentials only;
    # it never receives exchange credentials.
    command:
      [
        "python",
        "scripts/backup_postgres.py",
        "--loop",
        "--output-dir",
        "/var/lib/qts/backup",
        "--interval-seconds",
        "${QTS_BACKUP_INTERVAL_SECONDS:-240}",
      ]
    restart: "on-failure:3"
    environment:
      <<: *postgres-env
      QTS_S3_ENDPOINT_URL: ${QTS_S3_ENDPOINT_URL:-}
      QTS_S3_BUCKET: ${QTS_S3_BUCKET:-}
      QTS_S3_PREFIX: ${QTS_S3_PREFIX:-qts/backups}
      QTS_S3_REGION: ${QTS_S3_REGION:-us-east-1}
      QTS_S3_ACCESS_KEY: ${QTS_S3_ACCESS_KEY:-}
      QTS_S3_SECRET_KEY: ${QTS_S3_SECRET_KEY:-}
      QTS_BACKUP_OFF_HOST_ATTESTED: ${QTS_BACKUP_OFF_HOST_ATTESTED:-0}
      QTS_BACKUP_ATTESTED_BY: ${QTS_BACKUP_ATTESTED_BY:-}
      QTS_BACKUP_RPO_SECONDS: ${QTS_BACKUP_RPO_SECONDS:-300}
    volumes:
      - qts_backup:/var/lib/qts/backup
    depends_on:
      postgres:
        condition: service_healthy

  alert-sink:
    image: python:3.12-slim
    restart: unless-stopped
    command: ["python", "/scripts/alert_receiver.py", "--journal", "/data/alerts.jsonl"]
    environment:
      QTS_ALERT_SIGNING_SECRET: ${QTS_ALERT_SIGNING_SECRET:-}
      QTS_ALERT_HEARTBEAT_TIMEOUT_SECONDS: ${QTS_ALERT_HEARTBEAT_TIMEOUT_SECONDS:-30}
    ports:
      - "${QTS_ALERT_SINK_BIND:-127.0.0.1}:${QTS_ALERT_SINK_PORT:-8085}:8085"
    volumes:
      - ./scripts:/scripts:ro
      - alert_journal:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8085/health', timeout=2).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

secrets:
  binance_api_key:
    file: ${BINANCE_API_KEY_FILE_PATH:-./secrets/binance_api_key}
  binance_secret_key:
    file: ${BINANCE_SECRET_KEY_FILE_PATH:-./secrets/binance_secret_key}

volumes:
  qts_pgdata:
  qts_state:
  qts_backup:
  alert_journal:
