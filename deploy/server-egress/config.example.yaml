# Example only. Never place a real FlClash/Mihomo config in the repository.
# The real config is generated by scripts/server_egress/build_config.py into a
# 0700 directory outside the repository and transferred with strict SCP.
mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: warning
ipv6: false
authentication:
  - "qts:example-only-not-a-secret"
profile:
  store-selected: true
  store-fake-ip: false
geodata-mode: true
geo-auto-update: false
geodata-loader: memconservative
unified-delay: true
tcp-concurrent: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: normal
  nameserver: [223.5.5.5, 119.29.29.29]
  default-nameserver: [223.5.5.5, 119.29.29.29]
  proxy-server-nameserver: [223.5.5.5, 119.29.29.29]
  respect-rules: false
  use-hosts: false
  use-system-hosts: false

proxies:
  - name: example-vless
    type: vless
    server: example.invalid
    port: 443
    uuid: 00000000-0000-0000-0000-000000000000
    tls: true
    servername: example.invalid
    client-fingerprint: chrome
    flow: xtls-rprx-vision
    reality-opts:
      public-key: example-public-key-not-a-secret
      short-id: "0000"
    skip-cert-verify: false
    udp: true

proxy-groups:
  - name: QTS-AUTO
    type: url-test
    proxies: [example-vless]
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: false
  - name: QTS-EGRESS
    type: select
    proxies: [QTS-AUTO]

rules:
  - DOMAIN-SUFFIX,localhost,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - DOMAIN-SUFFIX,github.com,QTS-EGRESS
  - DOMAIN-SUFFIX,githubusercontent.com,QTS-EGRESS
  - DOMAIN,auth.docker.io,QTS-EGRESS
  - DOMAIN,registry-1.docker.io,QTS-EGRESS
  - DOMAIN-SUFFIX,docker.io,QTS-EGRESS
  - DOMAIN,demo-api.binance.com,QTS-EGRESS
  - DOMAIN-SUFFIX,demo-stream.binance.com,QTS-EGRESS
  - GEOIP,CN,DIRECT
  - MATCH,QTS-EGRESS
