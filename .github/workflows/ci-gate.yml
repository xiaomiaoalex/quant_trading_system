name: CI Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Python 版本策略：只锁 minor（3.12），不锁 patch。
# 原因：ubuntu-latest 镜像的 python-versions 清单只保留每个 minor 最近的 3~4 个补丁版本，
# 写死补丁号（如 3.12.5）会在镜像升级后直接失败（2026-10-19 迁移到 Ubuntu 26.04 即如此）。
# 补丁版本之间 ABI 一致，不构成兼容风险；需要固定补丁号时改 .python-version，不动本文件。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import-gate:
    name: Import Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          for i in 1 2 3; do python -m pip install --upgrade pip --timeout 30 && break || sleep 5; done
          pip install -r trader/requirements-ci.txt

      - name: Import Gate Tests
        run: |
          python -c "import trader.tests.test_binance_connector"
          python -c "import trader.tests.test_binance_private_stream"
          python -c "import trader.tests.test_binance_degraded_cascade"

  python-format-gate:
    name: Python Formatting Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          for i in 1 2 3; do python -m pip install --upgrade pip --timeout 30 && break || sleep 5; done
          pip install -r trader/requirements-ci.txt

      - name: Run Python formatting checks
        run: |
          python -m isort --check-only --profile black trader/
          python -m black --check --line-length 100 trader/

  architecture-gate:
    name: Architecture Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Core Plane IO Check
        run: python scripts/check_core_no_io.py

  p0-gate:
    name: P0 Regression Tests
    runs-on: ubuntu-latest
    needs: [import-gate, python-format-gate]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          for i in 1 2 3; do python -m pip install --upgrade pip --timeout 30 && break || sleep 5; done
          pip install -r trader/requirements-ci.txt

      - name: Run P0 Tests
        run: |
          python -m pytest -q trader/tests/test_binance_connector.py --tb=short
          python -m pytest -q trader/tests/test_binance_private_stream.py --tb=short
          python -m pytest -q trader/tests/test_binance_degraded_cascade.py --tb=short
          python -m pytest -q trader/tests/test_deterministic_layer.py --tb=short
          python -m pytest -q trader/tests/test_hard_properties.py --tb=short

  control-gate:
    name: Control Gate
    runs-on: ubuntu-latest
    needs: p0-gate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          for i in 1 2 3; do python -m pip install --upgrade pip --timeout 30 && break || sleep 5; done
          pip install -r trader/requirements-ci.txt

      - name: Run Control Tests
        run: |
          python -m pytest -q trader/tests/test_api_endpoints.py -k "risk and (invalid_payload or missing_required_fields)" --tb=short
          python -m pytest -q trader/tests/test_binance_degraded_cascade.py -k "local_killswitch or no_report_storm" --tb=short
          python -m pytest -q trader/tests/test_hard_properties.py -k "fail_closed or cooldown_no_storm" --tb=short

  postgres-integration:
    name: Postgres Integration Tests
    runs-on: ubuntu-latest
    needs: control-gate
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: trading
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader_pwd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trader -d trading"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_CONNECTION_STRING: postgresql://trader:trader_pwd@127.0.0.1:5432/trading
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          for i in 1 2 3; do python -m pip install --upgrade pip --timeout 30 && break || sleep 5; done
          pip install -r trader/requirements-ci.txt

      - name: Wait for Postgres
        run: |
          python - <<'PY'
          import socket
          import time

          host = "127.0.0.1"
          port = 5432
          deadline = time.time() + 60
          last_error = None
          while time.time() < deadline:
              try:
                  with socket.create_connection((host, port), timeout=2):
                      print("postgres ready")
                      break
              except OSError as exc:
                  last_error = exc
                  time.sleep(1)
          else:
              raise SystemExit(f"postgres not ready: {last_error}")
          PY

      - name: Run Postgres Tests
        run: |
          python -m pytest -q trader/tests/test_postgres_storage.py --tb=short
          python -m pytest -q trader/tests/test_risk_idempotency_persistence.py --tb=short
          python -m pytest -q trader/tests/test_history_dataset_store_pg.py --tb=short
          python -m pytest -q trader/tests/test_trading_postgres.py --tb=short
          python -m pytest -q trader/tests/test_research_postgres.py --tb=short

  trading-core-gate:
    name: Trading Core and Research Tests
    runs-on: ubuntu-latest
    needs: [p0-gate]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          for i in 1 2 3; do python -m pip install --upgrade pip --timeout 30 && break || sleep 5; done
          pip install -r trader/requirements-ci.txt

      - name: Run Trading Core Tests
        run: |
          python -m pytest -q trader/tests/test_trading_service.py --tb=short
          python -m pytest -q trader/tests/test_trading_runtime.py --tb=short
          python -m pytest -q trader/tests/test_trading_api.py --tb=short
          python -m pytest -q trader/tests/test_trading_ingress.py --tb=short
          python -m pytest -q trader/tests/test_spot_execution_adapter.py --tb=short
          python -m pytest -q trader/tests/test_runtime_entrypoint.py --tb=short
          python -m pytest -q trader/tests/test_research_runtime.py --tb=short
          python -m pytest -q trader/tests/test_trading_performance.py --tb=short

  frontend-gate:
    name: Frontend Typecheck and Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
