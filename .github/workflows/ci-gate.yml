name: CI Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: every job only reads the repository.  The release build
# workflow is the only place that requests packages: write.
permissions:
  contents: read

# Python 版本策略：只锁 minor（3.12），不锁 patch。
# 原因：ubuntu-latest 镜像的 python-versions 清单只保留每个 minor 最近的 3~4 个补丁版本，
# 写死补丁号（如 3.12.5）会在镜像升级后直接失败（2026-10-19 迁移到 Ubuntu 26.04 即如此）。
# 补丁版本之间 ABI 一致，不构成兼容风险；需要固定补丁号时改 .python-version，不动本文件。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  manifest-gate:
    name: Test Manifest Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete test classification and CI selection
        run: |
          python scripts/run_ci_checks.py --scope manifest --reports-dir reports
      - name: Upload manifest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-manifest-report
          path: reports/test-manifest.json
          if-no-files-found: warn
      - name: Upload runner record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-runner-record
          path: reports/run-ci-checks-manifest.json
          if-no-files-found: error

  import-gate:
    name: Import Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            trader/requirements-ci.txt
            trader/requirements-ci.constraints.txt

      - name: Install dependencies from locked constraints
        run: |
          python -m pip install --require-hashes -r trader/requirements-ci.constraints.txt

      - name: Import every test module
        run: |
          QTS_TEST_NETWORK_POLICY=offline \
            python -m pytest trader/tests --collect-only -q -p no:cacheprovider

  python-format-gate:
    name: Python Formatting Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            trader/requirements-ci.txt
            trader/requirements-ci.constraints.txt

      - name: Install dependencies from locked constraints
        run: |
          python -m pip install --require-hashes -r trader/requirements-ci.constraints.txt

      # Scope: the existing trader/ tree plus the CI/ops modules owned by this
      # delivery.  A repo-wide scripts/ reformat is intentionally avoided.
      - name: Run Python formatting checks
        run: |
          FILES="scripts/verify_test_manifest.py scripts/check_junit.py \
          scripts/check_coverage.py scripts/compose_smoke.py \
          scripts/deploy_preflight.py scripts/release_manifest.py \
          scripts/summarize_observation.py scripts/release_binding.py \
          scripts/collect_runtime_release_binding.py scripts/deploy_gate.py \
          scripts/observe_trading_runtime.py scripts/verify_release_provenance.py \
          scripts/verify_deploy_gate_live.py scripts/validate_preview_env.py \
          scripts/validate_preview_stack.py scripts/prepare_pr_preview.py \
          scripts/preview_browser_smoke.py scripts/run_ci_checks.py conftest.py"
          # isort must use the same line length as black, otherwise the two
          # formatters disagree about where an import wraps.
          python -m isort --check-only --profile black --line-length 100 trader/ $FILES
          python -m black --check --line-length 100 trader/ $FILES

  type-check:
    name: Type Check (CI and Ops Modules)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            trader/requirements-ci.txt
            trader/requirements-ci.constraints.txt

      - name: Install dependencies from locked constraints
        run: |
          python -m pip install --require-hashes -r trader/requirements-ci.constraints.txt

      # Scope is deliberately limited to the CI/ops modules owned by this
      # delivery.  A repo-wide mypy cleanup is not part of this change; the
      # limitation is recorded in docs/CI_CD_IMPROVEMENT_RFC.md.
      - name: Type-check CI and ops modules
        run: |
          # follow-imports=skip keeps the check scoped to this delivery's
          # modules; a repo-wide type cleanup is explicitly out of scope.
          python -m mypy --follow-imports=skip \
            scripts/verify_test_manifest.py \
            scripts/check_junit.py \
            scripts/check_coverage.py \
            scripts/compose_smoke.py \
            scripts/deploy_preflight.py \
            scripts/release_manifest.py \
            scripts/summarize_observation.py \
            scripts/release_binding.py \
            scripts/collect_runtime_release_binding.py \
            scripts/deploy_gate.py \
            scripts/observe_trading_runtime.py \
            scripts/verify_release_provenance.py \
            scripts/verify_deploy_gate_live.py \
            scripts/validate_preview_env.py \
            scripts/validate_preview_stack.py \
            scripts/prepare_pr_preview.py \
            scripts/preview_browser_smoke.py \
            scripts/run_ci_checks.py

  architecture-gate:
    name: Architecture Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Core Plane IO Check
        run: python scripts/check_core_no_io.py

  p0-gate:
    name: P0 Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [manifest-gate]
    env:
      QTS_TEST_GROUP: p0
      QTS_TEST_EXCLUDE_GROUPS: external
      QTS_TEST_NETWORK_POLICY: offline
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            trader/requirements-ci.txt
            trader/requirements-ci.constraints.txt

      - name: Install dependencies from locked constraints
        run: |
          python -m pip install --require-hashes -r trader/requirements-ci.constraints.txt

      - name: Run P0 Tests
        run: |
          python scripts/run_ci_checks.py --scope p0 --reports-dir reports

      - name: Upload P0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-evidence
          path: |
            reports/junit-p0.*
            reports/run-ci-checks-p0.json
          if-no-files-found: warn

  offline-gate:
    name: Offline Unit and Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [manifest-gate]
    env:
      # P0 is repeated here so the coverage report matches the measured
      # baseline; the separate p0-gate job remains the fast-feedback gate.
      QTS_TEST_GROUP: p0,offline
      QTS_TEST_EXCLUDE_GROUPS: external
      QTS_TEST_NETWORK_POLICY: offline
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            trader/requirements-ci.txt
            trader/requirements-ci.constraints.txt

      - name: Install dependencies from locked constraints
        run: |
          python -m pip install --require-hashes -r trader/requirements-ci.constraints.txt

      - name: Run offline suite with coverage
        run: |
          python scripts/run_ci_checks.py --scope offline --reports-dir reports

      - name: Upload offline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-evidence
          path: |
            reports/junit-offline.*
            reports/coverage.xml
            reports/coverage-gate.json
            reports/run-ci-checks-offline.json
          if-no-files-found: warn

  loopback-gate:
    name: Loopback Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [manifest-gate]
    env:
      # These files drive a real loopback alert receiver, so they cannot run
      # under the strict "offline" policy that blocks every socket.  The
      # loopback policy still blocks every public address and DNS lookup.
      QTS_TEST_GROUP: loopback
      QTS_TEST_EXCLUDE_GROUPS: external
      QTS_TEST_NETWORK_POLICY: loopback
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            trader/requirements-ci.txt
            trader/requirements-ci.constraints.txt

      - name: Install dependencies from locked constraints
        run: |
          python -m pip install --require-hashes -r trader/requirements-ci.constraints.txt

      - name: Run loopback integration tests
        run: |
          python scripts/run_ci_checks.py --scope loopback --reports-dir reports

      - name: Upload loopback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loopback-evidence
          path: |
            reports/junit-loopback.*
            reports/run-ci-checks-loopback.json
          if-no-files-found: error

  research-ai-gate:
    name: Research and AI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [manifest-gate]
    env:
      QTS_TEST_SUBSET: research_ai
      QTS_TEST_EXCLUDE_GROUPS: external
      QTS_TEST_NETWORK_POLICY: offline
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            trader/requirements-ci.txt
            trader/requirements-ci.constraints.txt

      - name: Install dependencies from locked constraints
        run: |
          python -m pip install --require-hashes -r trader/requirements-ci.constraints.txt

      # Reuses the existing reliable suites for replay consistency, shadow /
      # paper promotion, "paper never enables live" and HITL approval gates.
      - name: Run Research and AI Tests
        run: |
          python scripts/run_ci_checks.py --scope research-ai --reports-dir reports

      - name: Upload Research/AI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-ai-evidence
          path: |
            reports/junit-research-ai.*
            reports/run-ci-checks-research-ai.json
          if-no-files-found: warn

  postgres-integration:
    name: Postgres Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [manifest-gate]
    services:
      postgres:
        image: postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
        env:
          POSTGRES_DB: trading
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader_pwd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trader -d trading"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_CONNECTION_STRING: postgresql://trader:trader_pwd@127.0.0.1:5432/trading
      REQUIRE_POSTGRES: "1"
      QTS_TEST_GROUP: postgres
      QTS_TEST_EXCLUDE_GROUPS: external
      QTS_TEST_NETWORK_POLICY: loopback
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            trader/requirements-ci.txt
            trader/requirements-ci.constraints.txt

      - name: Install dependencies from locked constraints
        run: |
          python -m pip install --require-hashes -r trader/requirements-ci.constraints.txt

      - name: Wait for Postgres
        run: |
          python - <<'PY'
          import socket
          import time

          host = "127.0.0.1"
          port = 5432
          deadline = time.time() + 60
          last_error = None
          while time.time() < deadline:
              try:
                  with socket.create_connection((host, port), timeout=2):
                      print("postgres ready")
                      break
              except OSError as exc:
                  last_error = exc
                  time.sleep(1)
          else:
              raise SystemExit(f"postgres not ready: {last_error}")
          PY

      - name: Run Postgres and Control API Tests
        run: |
          python scripts/run_ci_checks.py --scope postgres --reports-dir reports

      - name: Upload Postgres evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-evidence
          path: |
            reports/junit-postgres.*
            reports/run-ci-checks-postgres.json
          if-no-files-found: warn

  phase6-guard-gate:
    name: Phase 6 Startup Guard (Windows OS lock / Docker orphan probe)
    runs-on: windows-latest
    timeout-minutes: 15
    needs: [manifest-gate]
    env:
      QTS_TEST_SUBSET: phase6_guard
      QTS_TEST_EXCLUDE_GROUPS: external
      QTS_TEST_NETWORK_POLICY: open
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            trader/requirements-ci.txt
            trader/requirements-ci.windows.constraints.txt

      - name: Require a working Docker daemon for the production guard probe
        shell: pwsh
        run: |
          docker version
          if ($LASTEXITCODE -ne 0) {
            Write-Error "GUARD_DOCKER_UNAVAILABLE: the required phase-6 guard probe needs a running Docker daemon"
            exit 1
          }

      - name: Install dependencies from Windows locked constraints
        run: |
          python -m pip install --require-hashes -r trader/requirements-ci.windows.constraints.txt

      - name: Run startup guard tests
        run: |
          python scripts/run_ci_checks.py --scope windows-guard --reports-dir reports

      # The runner invokes the same strict checker with both flags; spell out
      # the contract here as well so a future refactor cannot silently make
      # the required Windows guard tolerant of skips.
      - name: Enforce zero skip/xfail guard evidence
        run: python scripts/check_junit.py reports/junit-phase6-guard.xml --require-zero-skipped --require-zero-xfailed --json-out reports/junit-phase6-guard.json

      - name: Upload guard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-guard-evidence
          path: |
            reports/junit-phase6-guard.xml
            reports/junit-phase6-guard.json
            reports/run-ci-checks-windows-guard.json
          if-no-files-found: error

  compose-config-gate:
    name: Compose Configuration and Credential Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            trader/requirements-ci.txt
            trader/requirements-ci.constraints.txt

      - name: Install dependencies from locked constraints
        run: |
          python -m pip install --require-hashes -r trader/requirements-ci.constraints.txt

      - name: Validate Compose configuration
        run: |
          python scripts/run_ci_checks.py --scope linux-docker --reports-dir reports

      - name: Upload Compose runner record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-runner-record
          path: reports/run-ci-checks-linux-docker.json
          if-no-files-found: error

      - name: Check credential isolation
        run: python scripts/check_credential_isolation.py --compose compose.yml

  frontend-gate:
    name: Frontend Lint, Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-evidence
          path: |
            Frontend/coverage
            Frontend/dist
          if-no-files-found: warn

  pr-preview-smoke-gate:
    name: PR Candidate Image and Browser Smoke
    # Always registered so ci-required never sees a skipped dependency.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [manifest-gate]
    env:
      QTS_PR_PREVIEW_PROJECT: qts-ci-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
      QTS_PR_PREVIEW_ORIGIN: http://127.0.0.1:18080
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Publish the no-side-effect PR preview contract
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json, pathlib
          path = pathlib.Path('reports/pr-preview-plan.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({
            'ok': True,
            'event': 'push',
            'services_started': False,
            'browser_smoke_executed': False,
            'note': 'PR image/browser checks apply to pull_request events only',
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Resolve the actual tested merge commit
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "pull/${{ github.event.pull_request.number }}/merge" --depth=1
          TESTED_SHA="$(git rev-parse FETCH_HEAD)"
          case "$TESTED_SHA" in
            *[!0-9a-f]*|'') echo "PR_MERGE_SHA_INVALID" >&2; exit 1 ;;
          esac
          [ "${#TESTED_SHA}" -eq 40 ] || { echo "PR_MERGE_SHA_INVALID" >&2; exit 1; }
          echo "TESTED_SHA=$TESTED_SHA" >> "$GITHUB_ENV"
          echo "HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"

      - name: Checkout the exact tested merge tree
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            trader/requirements-ci.txt
            trader/requirements-ci.constraints.txt

      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'pull_request'

      - name: Install dependencies from locked constraints
        run: python -m pip install --require-hashes -r trader/requirements-ci.constraints.txt

      - name: Build the immutable candidate images
        if: github.event_name == 'pull_request'
        run: |
          docker build --build-arg QTS_REVISION="$TESTED_SHA" \
            -t qts-runtime:pr-"$TESTED_SHA" .
          docker build -f Frontend/Dockerfile.preview \
            -t qts-preview-ui:pr-"$TESTED_SHA" Frontend
          RUNTIME_ID="$(docker image inspect --format '{{.Id}}' qts-runtime:pr-"$TESTED_SHA")"
          UI_ID="$(docker image inspect --format '{{.Id}}' qts-preview-ui:pr-"$TESTED_SHA")"
          case "$RUNTIME_ID" in sha256:*) ;; *) echo "RUNTIME_ID_INVALID" >&2; exit 1;; esac
          case "$UI_ID" in sha256:*) ;; *) echo "UI_ID_INVALID" >&2; exit 1;; esac
          echo "RUNTIME_ID=$RUNTIME_ID" >> "$GITHUB_ENV"
          echo "UI_ID=$UI_ID" >> "$GITHUB_ENV"

      - name: Prepare and verify the preview configuration
        if: github.event_name == 'pull_request'
        env:
          QTS_PREVIEW_COMPOSE_PROJECT: qts-ci-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          QTS_PREVIEW_ID: pr-${{ github.event.pull_request.number }}
          QTS_PREVIEW_COMMIT: ${{ env.TESTED_SHA }}
          QTS_PREVIEW_ORIGIN: http://127.0.0.1:18080
          QTS_PREVIEW_HTTP_PORT: "18080"
          QTS_PREVIEW_ALERT_PORT: "18085"
          QTS_PREVIEW_RUNTIME_IMAGE: qts-runtime:pr-${{ env.TESTED_SHA }}
          QTS_PREVIEW_RUNTIME_IMAGE_ID: ${{ env.RUNTIME_ID }}
          QTS_PREVIEW_UI_IMAGE: qts-preview-ui:pr-${{ env.TESTED_SHA }}
          QTS_PREVIEW_POSTGRES_PASSWORD: pg_pr_${{ github.run_id }}_${{ github.run_attempt }}
          QTS_PREVIEW_PASSWORD_HASH: REPLACE_WITH_GENERATED_HASH
        run: |
          PASSWORD_HASH="$(docker run --rm qts-runtime:pr-"$TESTED_SHA" python -c \
            'from trader.api.auth import hash_password;print(hash_password("pr-'"$TESTED_SHA"'"))')"
          case "$PASSWORD_HASH" in scrypt\$*) ;; *) echo "PASSWORD_HASH_INVALID" >&2; exit 1;; esac
          export QTS_PREVIEW_PASSWORD_HASH="$PASSWORD_HASH"
          python scripts/prepare_pr_preview.py \
            --head-sha "$HEAD_SHA" --merge-sha "$TESTED_SHA" \
            --runtime-image "$QTS_PREVIEW_RUNTIME_IMAGE" \
            --runtime-image-id "$QTS_PREVIEW_RUNTIME_IMAGE_ID" \
            --ui-image "$QTS_PREVIEW_UI_IMAGE" --ui-image-id "$UI_ID" \
            --preview-plan reports/pr-preview-plan.json
          python scripts/run_ci_checks.py --scope preview-stack --reports-dir reports

      - name: Generate a synthetic operator password hash
        if: github.event_name == 'pull_request'
        run: |
          printf '%s' "pr-$TESTED_SHA" > "$RUNNER_TEMP/qts-pr-password.txt"
          chmod 600 "$RUNNER_TEMP/qts-pr-password.txt"

      - name: Start the isolated preview
        if: github.event_name == 'pull_request'
        run: |
          docker compose -f compose.yml -f deploy/compose.preview.yml \
            --env-file reports/preview.env -p "$QTS_PR_PREVIEW_PROJECT" \
            up -d --no-build postgres control research history web

      - name: Verify the running images
        if: github.event_name == 'pull_request'
        run: |
          docker compose -f compose.yml -f deploy/compose.preview.yml \
            --env-file reports/preview.env -p "$QTS_PR_PREVIEW_PROJECT" ps --format json \
            > reports/pr-preview-containers.json
          python - <<'PY'
          import json, os
          rows = [json.loads(line) for line in open('reports/pr-preview-containers.json', encoding='utf-8') if line.strip()]
          runtime, ui = os.environ['RUNTIME_ID'], os.environ['UI_ID']
          if not any(row.get('ImageID') == runtime for row in rows):
              raise SystemExit('RUNTIME_IMAGE_ID_NOT_RUNNING')
          if not any(row.get('ImageID') == ui for row in rows):
              raise SystemExit('UI_IMAGE_ID_NOT_RUNNING')
          PY

      - name: Run the real-browser login smoke
        if: github.event_name == 'pull_request'
        env:
          QTS_PR_PREVIEW_PASSWORD_FILE: ${{ runner.temp }}/qts-pr-password.txt
          QTS_PR_PREVIEW_IMAGE_ID: ${{ env.RUNTIME_ID }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install chromium
          python scripts/run_ci_checks.py --scope pr-browser-smoke --reports-dir reports

      - name: Upload PR preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-evidence
          path: |
            reports/pr-preview-plan.json
            reports/preview-stack.json
            reports/run-ci-checks-preview-stack.json
            reports/pr-preview-containers.json
            reports/browser-smoke.json
            reports/run-ci-checks-pr-browser-smoke.json
          if-no-files-found: warn

      - name: Remove only this PR's Compose resources
        if: always()
        run: |
          if [ -f reports/preview.env ]; then
            docker compose -f compose.yml -f deploy/compose.preview.yml \
              --env-file reports/preview.env -p "$QTS_PR_PREVIEW_PROJECT" \
              down -v --remove-orphans || true
          fi
          rm -f "$RUNNER_TEMP/qts-pr-password.txt"

  ci-required:
    name: CI Required
    if: always()
    needs:
      - manifest-gate
      - import-gate
      - python-format-gate
      - type-check
      - architecture-gate
      - p0-gate
      - offline-gate
      - loopback-gate
      - research-ai-gate
      - postgres-integration
      - compose-config-gate
      - phase6-guard-gate
      - frontend-gate
      - pr-preview-smoke-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gating job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {
              name: payload.get("result")
              for name, payload in needs.items()
              if payload.get("result") != "success"
          }
          if bad:
              raise SystemExit(f"CI_REQUIRED_FAILED: {json.dumps(bad, sort_keys=True)}")
          print(f"CI Required: all {len(needs)} required jobs succeeded")
          PY
